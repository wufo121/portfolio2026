<!-- Status Bar -->
<div class="status-bar">

  <!-- Left side -->
  <div class="status-left">
    <span class="status-item status-branch">
      <span class="icon">⎇</span>
      main
    </span>
    <span class="status-item status-sync">
      <span class="icon">↻</span>
      0↓ 0↑
    </span>
    <span class="status-item status-errors">
      <span class="icon">⊘</span>
      0
      <span class="icon ml">△</span>
      0
    </span>
  </div>

  <!-- Right side -->
  <div class="status-right">
    <span class="status-item">Ln 1, Col 1</span>
    <span class="status-item">Spaces: 2</span>
    <span class="status-item">UTF-8</span>
    <span class="status-item">TypeScript</span>
    <span class="status-item status-live">
      <span class="live-dot"></span>
      Live Share
    </span>
    <span class="status-item">{{ currentTime }}</span>
  </div>

</div>
